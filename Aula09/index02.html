<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Conteúdo Aula09 - HTML</title>
  </head>
  <body>
    
    <h1>Definindo imagens no HTML</h1>

    <img src="img/carro-senna.png" alt="McLaren MP4/5B" width="300" height="170">

    <hr>

    <h3>Definindo altura e largura de imagem com o CSS</h3>

    <img src="img/carro-senna.png" alt="McLaren MP4/5B" style="width: 300px; height: 170px;">

    <hr>

    <h3>Utilizando imagens dinâmicas no HTML</h3>

    <img src="img/nyan-cat.gif" style="width: 100px; height: 100px;">

    <hr>

    <h3>Utilizando imagem flutuante</h3>

    <p>
      <img src="img/nyan-cat.gif" style="width: 50px; height: 50px; float: right">
      Somente a dor coletiva gera união.
    </p>

  </body>
</html>
